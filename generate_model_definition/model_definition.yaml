state:
  position: [0.0, 0.0, 0.0] # Position in world frame [x, y, z] (m)
  orientation: [1.0, 0.0, 0.0, 0.0] # Orientation of the body frame in world frame as a quaternion [qw, qx, qy, qz]
  linear_velocity: [0.0, 0.0, 0.0] # Linear velocity in world frame [vx, vy, vz] (m/s)
  angular_velocity: [0.0, 0.0, 0.0] # Angular velocity in body frame [wx, wy, wz] (rad/s)
  motor_angular_velocity: [0.0, 0.0, 0.0, 0.0] # Motor angular velocity [w0, w1, w2, w3] (rad/s)
actuation:
  # thrust: 0.0 # Total thrust generated by the motors (N)
  # angular_velocity: [0.0, 0.0, 0.0] # Angular velocity in body frame [wx, wy, wz] (rad/s)
  motor_angular_velocity: [0.0, 0.0, 0.0, 0.0] # Motor angular velocity [w0, w1, w2, w3] (rad/s)
dynamics:
  position_dot: [0.0, 0.0, 0.0] # Time derivative of position in world frame [vx, vy, vz] (m/s)
  orientation_dot: [0.0, 0.0, 0.0, 0.0] # Time derivative of orientation as a quaternion [dqw, dqx, dqy, dqz]
  linear_velocity_dot: [0.0, 0.0, 0.0] # Time derivative of linear velocity in world frame [ax, ay, az] (m/s^2)
  angular_velocity_dot: [0.0, 0.0, 0.0] # Time derivative of angular velocity in body frame [alpha_x, alpha_y, alpha_z] (rad/s^2)
  motor_angular_velocity_dot: [0.0, 0.0, 0.0, 0.0] # Time derivative of motor angular velocity [dw0, dw1, dw2, dw3] (rad/s^2)
parameters:
  mass: 1.0 # Mass of the MAV (kg)
  desired_orientation: [1.0, 0.0, 0.0, 0.0] # Desired orientation as a quaternion [qw, qx, qy, qz]
  inertia: [0.0049, 0.0049, 0.0069] # Inertia matrix diagonal elements [Ixx, Iyy, Izz] (kg*m^2)
  motors_dx: [-0.08, 0.08, -0.08, 0.08] # Distance from the center of mass to the motors in x direction (m)
  motors_dy: [-0.08, -0.08, 0.08, 0.08] # Distance from the center of mass to the motors in y direction (m)
  motors_cf: [1.91e-6, 1.91e-6, 1.91e-6, 1.91e-6] # Thrust coefficient for each motor (N/(rad/s)^2)
  motors_ct: [2.6e-7, 2.6e-7, 2.6e-7, 2.6e-7] # Torque coefficient for each motor (N*m/(rad/s)^2)
  motors_tau: [0.02, 0.02, 0.02, 0.02] # Time constant for each motor (s)
  motors_direction: [-1, 1, 1, -1] # Direction of each motor (1 for clockwise, -1 for counter-clockwise)
  motors_min_angular_velocity: [0.0, 0.0, 0.0, 0.0] # Minimum angular velocity for each motor (rad/s)
  motors_max_angular_velocity: [2200.0, 2200.0, 2200.0, 2200.0] # Maximum angular velocity for each motor (rad/s)