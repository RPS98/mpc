state:
  position: [0.0, 0.0, 0.0] # Position in world frame [x, y, z] (m)
  orientation: [1.0, 0.0, 0.0, 0.0] # Orientation of the body frame in world frame as a quaternion [qw, qx, qy, qz]
  linear_velocity: [0.0, 0.0, 0.0] # Linear velocity in world frame [vx, vy, vz] (m/s)
  theta: 0.0 # Contouring progress along the path 
actuation:
  thrust: 0.0 # Total thrust generated by the motors (N)
  angular_velocity: [0.0, 0.0, 0.0] # Angular velocity in body frame [wx, wy, wz] (rad/s)
  theta_velocity: 0.0 # Rate of change of contouring progress along the path
dynamics:
  position_dot: [0.0, 0.0, 0.0] # Time derivative of position in world frame [vx, vy, vz] (m/s)
  orientation_dot: [0.0, 0.0, 0.0, 0.0] # Time derivative of orientation as a quaternion [dqw, dqx, dqy, dqz]
  linear_velocity_dot: [0.0, 0.0, 0.0] # Time derivative of linear velocity in world frame [ax, ay, az] (m/s^2)
  theta_dot: 0.0 # Time derivative of contouring progress along the path
parameters:
  mass: 1.0 # Mass of the MAV (kg)
  desired_orientation: [1.0, 0.0, 0.0, 0.0] # Desired orientation as a quaternion [qw, qx, qy, qz]
  theta_knot_1: 0.0  # Knot_1 for contouring progress along the path
  position_knot_1: [0.0, 0.0, 0.0]  # Position at Knot_1 [x, y, z] (m)
  m_knot_1: [0.0, 0.0, 0.0]  # derivate at Knot_1 for contouring progress along the path
  theta_knot_2: 0.0  # Knot_2 for contouring progress along the path
  position_knot_2: [0.0, 0.0, 0.0]  # Position at Knot_2 [x, y, z] (m)
  m_knot_2: [0.0, 0.0, 0.0]  # derivate at Knot_2 for contouring progress along the path
  theta_knot_3: 0.0  # Knot_3 for contouring progress along the path
  position_knot_3: [0.0, 0.0, 0.0]  # Position at Knot_3 [x, y, z] (m)
  m_knot_3: [0.0, 0.0, 0.0]  # derivate at Knot_3 for contouring progress along the path