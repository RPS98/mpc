mpc:
  N_horizon: 30 # Prediction steps
  tf: 2.0 # Prediction horizon in seconds
  constraints:
    # Indices of bounds on u at intermediate shooting nodes (0 to N-1)
    idxbu: [0, 1, 2, 3] # Bounded control inputs: [thrust, wx, wy, wz]
    # Indices of bounds on x at shooting nodes (1 to N)
    idxbx: [7, 8, 9] # Bounded states: [vx, vy, vz]
    # Indices of soft bounds on x at shooting nodes (1 to N)
    idxsbx: [0, 1, 2] # Soft bounded states of idxbx: [vx, vy, vz]
    # Lower soft bounds for states
    lsbx: [-0.2, -0.2, -0.2] # Lower soft bounds for states: [vx, vy, vz]
    # Upper soft bounds for states
    usbx: [0.2, 0.2, 0.2] # Upper soft bounds for states: [vx, vy, vz]
    # Lower bounds on nonlinear constraints at shooting nodes (1 to N)
    lh: []
    # Upper bounds on nonlinear constraints at shooting nodes (1 to N)
    uh: []
    # Indices of soft nonlinear constraints at shooting nodes (1 to N)
    idxsh: []
solver:
  export_dir: 'acados_position_mpc/'
  generate_c_code: true
  verbose: true
  cost_type: NONLINEAR_LS
  qp_solver: PARTIAL_CONDENSING_HPIPM
  nlp_solver_type: SQP_RTI
  hessian_approx: GAUSS_NEWTON
  integrator_type: ERK
integrator:
  generate_c_code: true
  integrator_type: ERK
  num_stages: 4
  num_steps: 3
cpp_module:
  generate: true
  project_name: acados_position_mpc