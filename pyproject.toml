[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc_acados_core"
version = "0.1.0"
authors = [{ name = "Rafael Pérez Seguí", email = "r.psegui@upm.es" }]
description = "Shared core for acados-based MPC controllers (MAV)"
license = { text = "BSD-3-Clause" }
dependencies = [
    "numpy>=1.22",
    "casadi",
    "acados-template",
    "pyyaml",
    "jinja2",
]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["mpc_acados_core", "mpc_acados_core.*"]

[tool.setuptools.package-data]
"mpc_acados_core" = [
    "cpp_interface/**/*",
    "generate/templates/**/*",
]
