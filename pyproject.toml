[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc_position"
version = "0.1.0"
authors = [{ name = "Rafael Pérez Seguí", email = "r.psegui@upm.es" }]
description = "MPC Library for MAVs using acados"
license = { text = "BSD-3-Clause" }
dependencies = [
    "numpy>=1.22",
    "acados-template",
    "pyyaml"
]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["mpc_position", "mpc_position.*"]

[tool.setuptools.package-data]
"*" = ["cpp_interface/**/*"]

[project.scripts]
mpc-acados-solver = "mpc_position.acados_solver:main"
