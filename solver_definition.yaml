mpc:
  N_horizon: 30 # Prediction steps
  tf: 0.6 # Prediction horizon in seconds
  Q: [5.0, 5.0, 10.0, 0.1, 0.1, 20.0, 0.1, 0.1, 0.1] # Weight for internal states: [x, y, z, roll, pitch, yaw, vx, vy, vz]
  Qe: [10.0, 10.0, 20.0, 0.1, 0.1, 20.0, 0.1, 0.1, 0.1] # Weight for end states: [x, y, z, roll, pitch, yaw, vx, vy, vz]
  R: [0.8, 1.0, 1.0, 0.5] # Weight for control inputs: [thrust, wx, wy, wz]
  idxbu: [0, 1, 2, 3] # Indices of bounded control inputs: [thrust, wx, wy, wz]
  lbu: [0.01, -5.0, -5.0, -5.0] # Lower bounds for control inputs: [thrust, wx, wy, wz]
  ubu: [40.0, 5.0, 5.0, 5.0] # Upper bounds for control inputs: [thrust, wx, wy, wz]
  idxbx: [] # Indices of bounded states: [x, y, z, roll, pitch, yaw, vx, vy, vz]
  idxbx_e: [] # Indices of bounded states at terminal shooting node (N): [x, y, z, roll, pitch, yaw, vx, vy, vz]
  lbx: [] # Lower bounds for states: [x, y, z, qw, qx, qy, qz, vx, vy, vz]
  ubx: [] # Upper bounds for states: [x, y, z, qw, qx, qy, qz, vx, vy, vz]
  p: [1.0, 9.81] # Online parameter: [mass, gravity]
solver:
  export_dir: ''
  generate_c_code: true
  verbose: true
  cost_type: NONLINEAR_LS
  qp_solver: PARTIAL_CONDENSING_HPIPM
  nlp_solver_type: SQP_RTI
  hessian_approx: GAUSS_NEWTON
  integrator_type: ERK
integrator:
  generate_c_code: true
  integrator_type: ERK
  num_stages: 4
  num_steps: 3
cpp_module:
  generate: false
  project_name: acados_mpc_solver
  project_path: 'test_project'